name: Generate Connect Cloud manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DESCRIPTION"
      - "app.R"
      - "R/**"
      - "deploy/generate_manifest.R"
      - ".github/workflows/generate-manifest.yml"

permissions:
  contents: write

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Install application and deployment dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rsconnect

      - name: Generate manifest
        run: Rscript deploy/generate_manifest.R

      - name: Validate manifest
        run: |
          Rscript -e "x <- jsonlite::read_json('manifest.json'); stopifnot(x$version == 1, file.exists('app.R')); cat('manifest.json is valid\n')"

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json is already current."
            exit 0
          fi
          git commit -m "Generate Connect Cloud manifest"
          git push
