name: Generate Connect Cloud manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DESCRIPTION"
      - "app.R"
      - "R/**"
      - "data/**"
      - "www/**"
      - ".rscignore"
      - "deploy/generate_manifest.R"
      - ".github/workflows/generate-manifest.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "DESCRIPTION"
      - "app.R"
      - "R/**"
      - "data/**"
      - "www/**"
      - ".rscignore"
      - "deploy/generate_manifest.R"
      - ".github/workflows/generate-manifest.yml"
      - ".connect-cloud-trigger"

permissions:
  contents: write

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up supported R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Install application and deployment dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rsconnect
            any::cpp11
            any::progress
            any::RcppArmadillo
            any::RcppEigen

      - name: Generate manifest
        run: Rscript deploy/generate_manifest.R

      - name: Validate manifest
        run: |
          Rscript -e 'x <- jsonlite::read_json("manifest.json"); stopifnot(x$version == 1L, x$metadata$appmode == "shiny", file.exists("app.R"), length(x$packages) > 0L, !"rsconnect" %in% names(x$packages)); cat("manifest.json is valid and excludes rsconnect\n")'

      - name: Commit manifest
        run: |
          rm -f .connect-cloud-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "manifest.json is already current."
            exit 0
          fi
          git commit -m "Generate Connect Cloud manifest"
          git push
