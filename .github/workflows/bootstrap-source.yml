name: Bootstrap project source

on:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .bootstrap/part-00 \
            .bootstrap/part-01 \
            .bootstrap/part-02 \
            .bootstrap/part-03 \
            .bootstrap/fix-04-00 \
            .bootstrap/fix-04-01 \
            .bootstrap/fix-04-02 \
            .bootstrap/fix-04-03 \
            .bootstrap/fix-04-04 \
            > /tmp/r-econ-source.zip.b64

          echo "1c1a583d2cb5fa7f1396accc4d290d567c9ef5c4bb4d6379d7e813faf3e4136c  /tmp/r-econ-source.zip.b64" | sha256sum --check

          base64 --decode /tmp/r-econ-source.zip.b64 > /tmp/r-econ-source.zip
          echo "6ecc0df0b8c08894d8f706dd71e3979e61fb941282e9f49c5e6b4ffe17347607  /tmp/r-econ-source.zip" | sha256sum --check
          unzip -t /tmp/r-econ-source.zip
          unzip -o /tmp/r-econ-source.zip -d .

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit clean application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add R Econometrics Studio Shiny application"
          git push
