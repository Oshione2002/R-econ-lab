name: R checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::shiny, any::bslib, any::DT, any::htmltools, any::jsonlite
          needs: check
      - name: Parse source files
        run: Rscript -e "files <- c('app.R', list.files('R', full.names=TRUE, pattern='\\\\.R$')); invisible(lapply(files, parse)); cat('Parsed', length(files), 'R files\\n')"
      - name: Run tests
        run: Rscript -e "testthat::test_dir('tests/testthat')"
