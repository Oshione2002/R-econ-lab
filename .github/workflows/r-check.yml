name: R checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install test dependency
        run: Rscript -e "install.packages('testthat', repos='https://cloud.r-project.org')"
      - name: Parse source files
        run: Rscript -e "files <- c('app.R', list.files('R', full.names=TRUE, pattern='\\\\.R$')); invisible(lapply(files, parse)); cat('Parsed', length(files), 'R files\\n')"
      - name: Run tests
        run: Rscript -e "testthat::test_dir('tests/testthat')"
