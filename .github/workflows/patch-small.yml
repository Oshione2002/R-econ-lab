name: Patch invalid Shiny small helper

on:
  push:
    branches: [agent/fix-shiny-small]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-shiny-small
      - name: Replace invalid helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.R')
          text = path.read_text(encoding='utf-8')
          old = 'div(strong("Econometrics Studio"), small("Complete analysis workflow"))'
          new = 'div(strong("Econometrics Studio"), tags$small("Complete analysis workflow"))'
          if old not in text:
              raise SystemExit('Expected small() call was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.R
          git commit -m "Fix Shiny navbar small tag"
          git push
