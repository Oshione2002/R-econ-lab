name: Patch session UI helpers

on:
  push:
    branches: [agent/fix-session-disconnect]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-session-disconnect
      - name: Replace unqualified small helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.R')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(r'(?<!tags\$)\bsmall\(', 'tags$small(', text)
          if count == 0:
              print('No unqualified small() calls found.')
          else:
              path.write_text(updated, encoding='utf-8')
              print(f'Replaced {count} unqualified small() calls.')

          remaining = re.findall(r'(?<!tags\$)\bsmall\(', updated)
          if remaining:
              raise SystemExit('Unqualified small() calls remain.')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.R
          if git diff --cached --quiet; then
            echo "No app.R changes required."
            exit 0
          fi
          git commit -m "Fix reactive Shiny small tag helpers"
          git push
